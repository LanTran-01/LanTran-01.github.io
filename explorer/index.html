<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%MACHINE_TITLE%</title>
    <meta name="description" content="%MACHINE_DESCRIPTION%" />
    <meta name="theme-color" content="#07080a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // GitHub Pages deep links arrive via 404.html as <base>?redirect=<path>. Restore
      // the real URL before the router starts (see scripts/publish-site.mjs).
      (function () {
        var r = new URLSearchParams(location.search).get("redirect");
        if (r && r.charAt(0) === "/" && r.charAt(1) !== "/") history.replaceState(null, "", r);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This explorer is an interactive 3D application and needs JavaScript and WebGL.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
